# Default test profile — H2 in-memory, no DevServices
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:eidostest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false
# Only JDBC — no reactive pool on default test datasource
%test.quarkus.datasource.reactive=false
%test.quarkus.flyway.locations=classpath:db/eidos/migration
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none

# Reactive profile — activated by ReactiveTestProfile
%reactive.casehub.eidos.reactive.enabled=true
%reactive.quarkus.datasource.db-kind=postgresql
%reactive.quarkus.datasource.devservices.enabled=true
%reactive.quarkus.datasource.devservices.image-name=postgres:17-alpine
# Enable reactive pool; keep JDBC active for Hibernate ORM + Flyway
%reactive.quarkus.datasource.reactive=true
%reactive.quarkus.flyway.locations=classpath:db/eidos/migration
%reactive.quarkus.flyway.migrate-at-start=true
%reactive.quarkus.hibernate-orm.database.generation=none
