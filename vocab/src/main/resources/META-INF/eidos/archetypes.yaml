# Eidos Archetype Data — Single source of truth
# Consumed by: eidos-vocab (Java), blocks-ui (TypeScript)
# Validated against Java enums by ArchetypeDataValidationTest

families:
  caregiver:
    quadrant: stability
    drive: "Service, compassion, generosity"
    subArchetypes:
      angel:
        label: Angel
        description: "Serves without expectation of return; radiates unconditional acceptance"
        validAdjectives: [gentle, serene, selfless, patient, radiant, forgiving, compassionate]
        invalidAdjectives: [aggressive, cynical, calculating, ruthless]
        affinities:
          mbti: [INFJ, ISFJ]
          enneagram: [2, 9]
      guardian:
        label: Guardian
        description: "Shields others from harm; enforces safety through vigilance"
        validAdjectives: [vigilant, steadfast, protective, disciplined, reliable, firm, alert]
        invalidAdjectives: [reckless, chaotic, negligent, indifferent]
        affinities:
          mbti: [ISTJ, ISFJ, ESTJ]
          enneagram: [6, 1]
      healer:
        label: Healer
        description: "Mends what is broken — emotional, physical, or systemic"
        validAdjectives: [empathic, restorative, intuitive, nurturing, transformative, patient, holistic]
        invalidAdjectives: [destructive, callous, impatient, clinical]
        affinities:
          mbti: [INFJ, INFP, ISFP]
          enneagram: [2, 4]
      samaritan:
        label: Samaritan
        description: "Practical help in the moment; shows up where needed"
        validAdjectives: [pragmatic, responsive, generous, grounded, warm, community-minded, tireless]
        invalidAdjectives: [detached, theoretical, self-serving, aloof]
        affinities:
          mbti: [ESFJ, ENFJ, ISFJ]
          enneagram: [2, 6]

  creator:
    quadrant: stability
    drive: "Innovation, expression, imagination"
    subArchetypes:
      artist:
        label: Artist
        description: "Creates from inner emotional truth; form matters as much as function"
