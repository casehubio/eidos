# --- Behavioral tendency rules ---
# Derived from disposition axis scores
# Conditions: axis must exceed threshold on named pole (high/low)
# Strength: avgExcess > 0.3 = strong, > 0.15 = moderate, else mild

tendencyRules:
  - name: Skeptical
    description: "Questions assumptions and requests evidence before accepting claims"
    conditions:
      conflictMode: { pole: high, threshold: 0.15 }
      autonomy: { pole: high, threshold: 0.05 }
  - name: Methodical
    description: "Follows systematic processes and prefers structured approaches"
    conditions:
      ruleFollowing: { pole: high, threshold: 0.3 }
      riskAppetite: { pole: low, threshold: 0.1 }
  - name: Empathetic
    description: "Considers emotional impact and prioritises interpersonal harmony"
    conditions:
      conflictMode: { pole: low, threshold: 0.3 }
      socialOrientation: { pole: high, threshold: 0.2 }
  - name: Decisive
    description: "Commits to clear recommendations and avoids hedging"
    conditions:
      riskAppetite: { pole: high, threshold: 0.3 }
      conflictMode: { pole: high, threshold: 0.1 }
  - name: Collaborative
    description: "Seeks consensus and builds on others' contributions"
    conditions:
      socialOrientation: { pole: high, threshold: 0.4 }
  - name: Independent
    description: "Forms own assessments before consulting others"
    conditions:
      autonomy: { pole: high, threshold: 0.4 }
  - name: Cautious
    description: "Flags risks and errs on the side of safety"
    conditions:
      riskAppetite: { pole: low, threshold: 0.3 }
  - name: Bold
    description: "Explores novel approaches and embraces calculated risk"
    conditions:
      riskAppetite: { pole: high, threshold: 0.4 }
  - name: Diplomatic
    description: "Navigates disagreement through compromise and tact"
    conditions:
      conflictMode: { pole: low, threshold: 0.3 }
      socialOrientation: { pole: high, threshold: 0.1 }
  - name: Challenging
    description: "Pushes back on weak arguments and tests ideas rigorously"
    conditions:
      conflictMode: { pole: high, threshold: 0.4 }
  - name: Structured
    description: "Creates order, enforces standards, and follows procedure"
    conditions:
      ruleFollowing: { pole: high, threshold: 0.4 }
  - name: Adaptive
    description: "Adjusts approach based on circumstances rather than fixed rules"
    conditions:
      ruleFollowing: { pole: low, threshold: 0.3 }
  - name: Nurturing
    description: "Develops others' potential through patience and encouragement"
    conditions:
      conflictMode: { pole: low, threshold: 0.4 }
      socialOrientation: { pole: high, threshold: 0.3 }
  - name: Analytical
    description: "Breaks problems into components and evaluates evidence systematically"
    conditions:
      ruleFollowing: { pole: high, threshold: 0.2 }
      autonomy: { pole: high, threshold: 0.2 }
  - name: Persuasive
    description: "Influences through conviction and compelling reasoning"
    conditions:
      socialOrientation: { pole: high, threshold: 0.3 }
      conflictMode: { pole: high, threshold: 0.2 }
  - name: Protective
    description: "Guards against threats and prioritises safety over speed"
    conditions:
      riskAppetite: { pole: low, threshold: 0.4 }
      ruleFollowing: { pole: high, threshold: 0.2 }
  - name: Thorough
    description: "Does not skip steps or cut corners — checks everything before concluding"
    conditions:
      ruleFollowing: { pole: high, threshold: 0.25 }
      riskAppetite: { pole: low, threshold: 0.2 }
  - name: Creative
    description: "Thinks laterally, generates novel ideas, and makes unexpected connections"
    conditions:
      riskAppetite: { pole: high, threshold: 0.3 }
      ruleFollowing: { pole: low, threshold: 0.15 }
      autonomy: { pole: high, threshold: 0.1 }
  - name: Curious
    description: "Asks probing questions, explores deeply, and does not accept surface answers"
    conditions:
      riskAppetite: { pole: high, threshold: 0.2 }
      autonomy: { pole: high, threshold: 0.2 }
  - name: Patient
    description: "Takes time with problems, avoids premature conclusions, and sits with ambiguity"
    conditions:
      riskAppetite: { pole: low, threshold: 0.2 }
      conflictMode: { pole: low, threshold: 0.2 }
  - name: Direct
    description: "Says what needs saying without hedging, padding, or softening"
    conditions:
      conflictMode: { pole: high, threshold: 0.25 }
      ruleFollowing: { pole: low, threshold: 0.1 }
  - name: Pragmatic
    description: "Focuses on practical outcomes and what works over theoretical elegance"
    conditions:
      ruleFollowing: { pole: low, threshold: 0.05 }
      riskAppetite: { pole: low, threshold: 0.05 }

