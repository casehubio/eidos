# Eval profile — ChatModel is provided by AgentProviderChatModel (Claude CLI bridge) by default.
#
# Claude model selection:
#   claude config set model claude-sonnet-4-6
# ClaudeAgentProperties exposes: binaryPath, defaultTimeout, maxConcurrentSessions.
# There is NO quarkus property for model selection — it is configured via the Claude CLI.
#
# Model label for report identification (default: "claude"):
# casehub.eval.model.label=claude
#
# For Jlama runs (-Peval-jlama), add:
# casehub.eval.model.label=jlama
# quarkus.langchain4j.jlama.chat-model.model-name=tjake/Llama-3.2-3B-Instruct-JQ4
# quarkus.langchain4j.jlama.chat-model.temperature=0.0
# Model downloads automatically to ~/.jlama/ on first run (~2GB).

# Index casehub-platform-agent-claude for CDI bean discovery — JAR has Jandex but no
# beans.xml or Quarkus extension descriptor, so Quarkus skips it during augmentation.
quarkus.index-dependency.agent-claude.group-id=io.casehub
quarkus.index-dependency.agent-claude.artifact-id=casehub-platform-agent-claude

# Vertex AI — reads project/region from environment variables.
# Activated by -Dcasehub.eval.vertex.enabled=true (build-time).
# Override model with -Dcasehub.eval.vertex.model=claude-sonnet-4-5
casehub.eval.vertex.project-id=${ANTHROPIC_VERTEX_PROJECT_ID:}
casehub.eval.vertex.region=${CLOUD_ML_REGION:us-east5}
casehub.eval.vertex.model=claude-sonnet-4-5
casehub.eval.vertex.timeout-seconds=120
